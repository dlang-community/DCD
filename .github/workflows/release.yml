name: Publish Releases
on:
  release:
    types: [published]

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        # use older ubuntu / linux version for glibc compatibility
        include:
          - { dc: ldc-latest, os: ubuntu-22.04, arch: x86_64 }
          - { dc: ldc-latest, os: ubuntu-22.04-arm, arch: aarch64 }
          - { dc: ldc-latest, os: windows-latest, arch: x86_64 }
          - { dc: ldc-latest, os: macos-latest, arch: x86_64 }
          - { dc: ldc-latest, os: macos-latest, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup D
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      # Build

      - name: Build
        run: |
          dub build --build=release --config=client --arch=${{ matrix.arch }}
          dub build --build=release --config=server --arch=${{ matrix.arch }}

      # Package Release

      - name: Package the artificats
        shell: pwsh
        working-directory: bin
        run: |
          if ("${{ matrix.os }}" -like 'windows*') {
            7z a -tzip ..\dcd.zip dcd-client.exe dcd-server.exe
          } elseif ("${{ matrix.os }}" -like 'macos*') {
            gtar -cvzf ../dcd.tar.gz dcd-client dcd-server
          } else {
            tar -cvzf ../dcd.tar.gz dcd-client dcd-server
          }

      # Release

      - name: Release Linux
        if: contains(matrix.os, 'ubuntu')
        uses: WebFreak001/upload-asset@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS: linux
        with:
          file: dcd.tar.gz
          name: dcd-${TAG_RAW}-${OS}-${{ matrix.arch }}.tar.gz
          mime: application/tar+gzip

      - name: Release Macos
        if: contains(matrix.os, 'macos')
        uses: WebFreak001/upload-asset@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS: osx
        with:
          file: dcd.tar.gz
          name: dcd-${TAG_RAW}-${OS}-${{ matrix.arch }}.tar.gz
          mime: application/tar+gzip

      - name: Release Windows
        if: contains(matrix.os, 'windows')
        uses: WebFreak001/upload-asset@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS: windows
        with:
          file: dcd.zip
          name: dcd-${TAG_RAW}-${OS}-${{ matrix.arch }}.zip
          mime: application/zip

  VSIX:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The extension is platform-independent TypeScript, so a single
      # build covers all platforms (the server binary is not bundled;
      # users point dcd.serverPath at their own dcd-server).

      - name: Install dependencies
        working-directory: editors/code
        run: npm ci

      - name: Package .vsix
        working-directory: editors/code
        run: npx @vscode/vsce package --allow-missing-repository -o dcd-lsp.vsix

      - name: Release VSIX
        uses: WebFreak001/upload-asset@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: editors/code/dcd-lsp.vsix
          name: dcd-lsp-${TAG_RAW}.vsix
          mime: application/octet-stream
